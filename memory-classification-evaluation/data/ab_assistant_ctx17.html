<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>context 분류 17건 저장 가치 판정 (G-AS 재평가)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; }
  h1 { font-size: 1.2rem; }
  .progress { background:#eee; border-radius:8px; padding:4px 10px; margin: 8px 0; font-size: .9rem; }
  .card { border:1px solid #ccc; border-radius:10px; padding:14px 16px; margin:10px 0; }
  .card .meta { color:#888; font-size:.8rem; margin-bottom:6px; }
  .card .text { font-size:1rem; line-height:1.5; white-space:pre-wrap; }
  .btns { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .btns button { padding:8px 16px; border-radius:8px; border:1px solid #ccc; cursor:pointer; font-size:.9rem; }
  .store { background:#e6f4ea; }
  .store.active { background:#34a853; color:#fff; }
  .nostore { background:#fce8e6; }
  .nostore.active { background:#ea4335; color:#fff; }
  .summary { margin:16px 0; padding:12px; background:#f8f9fa; border-radius:10px; }
  .export { padding:10px 20px; background:#1a73e8; color:#fff; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<h1>context 분류 17건 — 저장 가치 판정 (17건)</h1>
<div class="progress" id="progress">0 / 17 판정됨</div>
<div class="summary">
  <b>판정 기준</b>: 이 assistant 발화가 장기 메모리에 저장할 가치가 있나요?<br/>
  🟢 <b>STORE</b> = 결과물·진단·세션 상태 요약·결정 등 장기 기억 가치 있음<br/>
  🔴 <b>NO_STORE</b> = 진행 중 발언, 다음 단계 예고, 임시 상태 — 저장 불필요<br/>
  <i>이 17건은 JEV가 "context(임시)"로 분류한 것들입니다. 실제로 임시인지, 결과물인지 판정해 주세요.</i>
</div>
<div id="cards"></div>
<div style="margin:20px 0"><button class="export" onclick="exportJSON()">판정 결과 내보내기 (JSON)</button></div>
<script>
const CARDS = [{"i": 0, "text": "이 세션은 방금 02:52에 435,078 토큰에서 **문제없이 압축됐다** — 오히려 컴팩션 로직은 동작 중이고, 압축 후 재성장한 context와 함께 현재 450K에서 다시 임계치에 도달한 상태다. 그런데 임계치 초과가 관찰됐는데도 아직 컴팩션이 없다는 건, 새 컴팩션 타이밍을 기다리는 중일 수 있다. 실행 중인 프로세스를 확인하겠다.", "jev_store": "STORE", "jev_store_conf": 0.57}, {"i": 1, "text": "9router만 실행 중이고 **pi 에이전트는 실행 중이 아니다**. 즉 이 문제는 \"룬타임에 세션 컴팩션이 잘못되서\"가 아닐 가능성이 크다. 사용자가 보고한 증상이 뭔지 정확히 알아야 한다. 세션 컴팩션이 *전혀* 안 되는 것인지, 특정 상황에서만 실패하는 것인지가 다르다.\n\n보다 구체적인 증거를 위해, 내가 본 notiondrive 9/8 세션의 컴팩션 시점 근처에서 컴팩션 요청이 실제로 어떤 모델/경로로 갔는지, 그 후 context가 어떻게 다시 늘었는지 확인하겠다. 또 hoplite 9/8 세션(0 컴팩션)이 실제로는 크기가 작아 컴팩션 임계치에 도달하지 않았을 뿐인지도 확인하겠다.", "jev_store": "STORE", "jev_store_conf": 0.84}, {"i": 2, "text": "이관 정보가 충분하다. 현재 상태를 정확히 파악했다:\n\n**세션 상태:**\n- cwd: `C:\\code\\pimade\\notiondrive`\n- 모델: `9router/deepcombo`, thinkingLevel: `medium`\n- 마지막 컴팩션(02:52) 요약 + 실측 결과 7건(v2.11 반영, 커밋 `728fb31` push 완료)\n- **14차 Hoplite 검토 진행 중**: A 스레드 결과는 NO-GO (Critical 2 + High 3) 받았고, C/D 결과가 대기 상태 (taskId: hl-1788930917321-cad5dc = A, hl-1788930917335-2ee16f = C, hl-1788930917349-83a22b = D)\n\n**세션 파일을 안전하게 백업**하고 이관 지시문을 작성하겠다.", "jev_store": "STORE", "jev_store_conf": 0.9}, {"i": 3, "text": "이관 정보가 충분하다. 현재 상태를 정확히 파악했다:\n\n**세션 상태:**\n- cwd: `C:\\code\\pimade\\notiondrive`\n- 모델: `9router/deepcombo`, thinkingLevel: `medium`\n- 마지막 컴팩션(02:52) 요약 + 실측 결과 7건(v2.11 반영, 커밋 `728fb31` push 완료)\n- **14차 Hoplite 검토 진행 중**: A 스레드 결과는 NO-GO (Critical 2 + High 3) 받았고, C/D 결과가 대기 상태 (taskId: hl-1788930917321-cad5dc = A, hl-1788930917335-2ee16f = C, hl-1788930917349-83a22b = D)\n\n**세션 파일을 안전하게 백업**하고 이관 지시문을 작성하겠다.", "jev_store": "STORE", "jev_store_conf": 0.87}, {"i": 4, "text": "✅ Paseo가 실행됐습니다.\n\n**상태:**\n- **Paseo.exe** 실행 중 — 메인 윈도우 표시됨 (제목: \"codegraph 오브젝트 그래프를 구축하는 중...\" — 프로젝트 인덱싱 중)\n- **내장 데몬**: `127.0.0.1:3030` LISTENING (PID 28000)\n- 전체 Paseo 프로세스 7개 (메인 + 데몬/렌더러 등) — 정상적인 Electron 구조\n\n참고로 실행 전 상태가 어땠는지 보면, 데몬이 14:39까지 떠 있다가 클라이언트 셧다운으로 종료된 상태였고(오늘 14:36 로그에 GitHub PR 상태 self-heal 오류 1건 있었음 — `gh` GraphQL 쿼리 파싱 실패), 지금 다시 띄운 겁니다. 창이 뜨면서 codegraph 인덱싱을 진행 중이니 잠시 후 정상 사용 가능할 겁니다.", "jev_store": "STORE", "jev_store_conf": 0.67}, {"i": 5, "text": "형식 파악됨. 이제 전체 세션을 스캔해서 powershell 호출의 오류 패턴을 분석한다.", "jev_store": "NO_STORE", "jev_store_conf": 0.7}, {"i": 6, "text": "원인 파악 거의 완료. 마지막으로 pi의 powershell 래퍼 구현이 어떻게 오류를 결정하는지 확인한다.", "jev_store": "NO_STORE", "jev_store_conf": 0.53}, {"i": 7, "text": "핵심 로직 라인을 찾았다. 이제 마지막 검증 몇 개만 하면 된다:", "jev_store": "NO_STORE", "jev_store_conf": 0.75}, {"i": 8, "text": "원인 파악이 거의 끝났어. 마지막 확정 검증 두 개만 더 할게.", "jev_store": "NO_STORE", "jev_store_conf": 0.69}, {"i": 9, "text": "vndv 소스 파악 완료. 이제 enhanced tarball 내부 소스를 추출해 확인합니다.", "jev_store": "NO_STORE", "jev_store_conf": 0.74}, {"i": 10, "text": "enhanced의 README/package.json 확인. 이제 핵심 source인 `extensions/codegraph.ts`를 확인합니다.", "jev_store": "NO_STORE", "jev_store_conf": 0.78}, {"i": 11, "text": "enhanced 소스 파악 완료 — `promptGuidelines` + `before_agent_start` + `resources_discover`(auto-index gate) 구조 확인. 이제 Pi 0.85.1 본체의 ExtensionAPI 타입 정의와 tool 병합·중복 등록 동작을 확인합니다.", "jev_store": "STORE", "jev_store_conf": 0.61}, {"i": 12, "text": "`before_agent_start`는 `systemPrompt`(전체 문자열) + `systemPromptOptions` 구조 확인. 이제 tool 중복 등록 시 충돌 처리와 extensions 디렉터리 로딩 규칙을 확인합니다.", "jev_store": "STORE", "jev_store_conf": 0.6}, {"i": 13, "text": "핵심 발견 완료. 이제 저장소의 확장 디렉터리 발견 규칙과 해시 기반 캐시 여부, 그리고 platform-ts 스킵 메커니즘을 확인합니다.", "jev_store": "NO_STORE", "jev_store_conf": 0.64}, {"i": 14, "text": "bundle에서 핵심 로직을 grep으로 확인합니다. 특히 `before_agent_start` 핸들러의 systemPrompt 병합 방식과 promptGuidelines 주입 위치, 그리고 확장 로딩 순서입니다.", "jev_store": "STORE", "jev_store_conf": 0.62}, {"i": 15, "text": "control 세션이 백그라운드로 돌고 있습니다 (10~20분 예상). 완료 알림을 기다리는 동안, OCC가 실제로 관여할 **트리거 조건을 더 정확히 확인**하겠습니다. control 실행이 끝나면 OCC 실행 → usage 비교입니다. 잠시 기다린 뒤 진행 상황을 확인합니다.", "jev_store": "NO_STORE", "jev_store_conf": 0.72}, {"i": 16, "text": "control 세션이 백그라운드로 돌고 있습니다 (10~20분 예상). 완료 알림을 기다리는 동안, OCC가 실제로 관여할 **트리거 조건을 더 정확히 확인**하겠습니다. control 실행이 끝나면 OCC 실행 → usage 비교입니다. 잠시 기다린 뒤 진행 상황을 확인합니다.", "jev_store": "NO_STORE", "jev_store_conf": 0.73}];
const store = JSON.parse(localStorage.getItem('ab_assistant_ctx17') || '{}');
let current = 0;

function render() {
  const c = CARDS[current];
  const prog = document.getElementById('progress');
  const judged = Object.keys(store).length;
  prog.textContent = judged + ' / ' + CARDS.length + ' 판정됨';
  const div = document.getElementById('cards');
  const v = store[c.i];
  div.innerHTML = `
    <div class="card">
      <div class="meta">#${c.i + 1} / ${CARDS.length} · JEV: ${c.jev_store} (conf ${c.jev_store_conf.toFixed(2)})</div>
      <div class="text"></div>
      <div class="btns">
        <button class="store ${v === 'store' ? 'active' : ''}" onclick="judge('store')">🟢 STORE (저장 가치 있음)</button>
        <button class="nostore ${v === 'nostore' ? 'active' : ''}" onclick="judge('nostore')">🔴 NO_STORE (저장 불필요)</button>
        <button onclick="next()">다음 →</button>
      </div>
    </div>`;
  div.querySelector('.text').textContent = c.text;
}
function judge(v) {
  store[CARDS[current].i] = v;
  localStorage.setItem('ab_assistant_ctx17', JSON.stringify(store));
  next();
}
function next() {
  if (current < CARDS.length - 1) { current++; render(); }
  else { document.getElementById('cards').innerHTML = '<p style="font-size:1.2rem">🎉 모든 카드 판정 완료! 내보내기 버튼으로 결과 저장.</p>'; }
  render();
}
function exportJSON() {
  const out = { judged_at: new Date().toISOString(), verdicts: store };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ab_assistant_ctx17.json';
  a.click();
}
render();
</script>
</body>
</html>
